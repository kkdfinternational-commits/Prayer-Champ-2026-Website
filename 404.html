<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Kirupasanam Prayer Champ 2026</title>
    <!--
      GitHub Pages serves THIS file for any address that is not a real file
      (for example /register, /my-card, /check-in or /admin when opened directly or refreshed).
      It does not load the website bundle. It only sends the visitor to index.html and passes the
      requested path along; index.html then restores the clean address and the app opens the right page.
      Because it never mentions a hashed asset file, it can never go out of date after a new build.
    -->
    <script>
      // The website lives in a repository sub-folder, so keep the first path segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>Please turn on JavaScript to open the Prayer Champ 2026 website.</noscript>
  </body>
</html>
